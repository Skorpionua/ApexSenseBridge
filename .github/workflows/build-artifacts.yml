# Fork-only helper: builds the Windows artifacts for a branch without a release.
name: Build ApexSenseBridge artifacts (fork)

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Build Patched VIIPER
        shell: powershell
        run: |
          if (Test-Path scripts\build-viiper-windows.ps1) {
            .\scripts\build-viiper-windows.ps1
          }
          if (Test-Path scripts\build-libviiper-windows.ps1) {
            .\scripts\build-libviiper-windows.ps1
          }

      - name: Build Engine, Tray, Playnite Extension and Offline Installer
        shell: powershell
        run: |
          .\scripts\build-installer.ps1

      - name: Native tests
        shell: powershell
        run: |
          ctest --test-dir .\build-win -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\verify-version-consistency.ps1 -CheckArtifacts

      - name: Tray settings UI test
        shell: cmd
        run: powershell -STA -NoProfile -ExecutionPolicy Bypass -File scripts\test-tray-controller-settings.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ApexSenseBridge-lightbar-brightness
          if-no-files-found: error
          path: |
            dist/ApexSenseBridge-Setup.exe
            dist/ApexSenseBridge-Portable.zip
            dist/*.pext
            build-win/Release/ApexSenseBridge.exe
            build-win/Release/ApexSenseBridgeTray.exe
